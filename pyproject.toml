[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2term"
version = "0.1.0"
description = "YouTube video playback in terminal as ASCII"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "asciifyy",
    "pillow",
    "yt-dlp",
]

[project.scripts]
yt2term = "yt2term.main:main"